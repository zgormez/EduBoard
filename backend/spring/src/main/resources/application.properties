spring.application.name=spring

# --- H2 in-memory database ---
spring.datasource.url=jdbc:h2:mem:todo;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JWT ---
# JWT (security token)
# MUST be >= 32 characters (32 bytes) for HS256
app.jwt.secret=ThisIsA_SUPER_LONG_secret_key_for_HS256_at_least_32_chars_12345
app.jwt.exp-ms=86400000

# --- Mail (won't connect until used) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your@gmail.com
spring.mail.password=app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- Frontend URL for links ---
app.frontend.base-url=http://localhost:3000
